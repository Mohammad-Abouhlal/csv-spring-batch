spring:
  datasource:
    url: jdbc:h2:mem:employee_test_${random.uuid};DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ''
  sql:
    init:
      mode: always
      schema-locations: classpath:org/springframework/batch/core/schema-h2.sql
  jpa:
    hibernate:
      ddl-auto: create-drop
  batch:
    jdbc:
      initialize-schema: always
    job:
      enabled: false
app:
  csv:
    directory: ${java.io.tmpdir}/employee-csv-batch-tests

